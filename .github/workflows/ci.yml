name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Testes SQL das RPCs (RNF-11)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: scripts/test-db.sh
      - run: npx playwright install --with-deps chromium
      - name: E2E (venda e fiado)
        run: npx playwright test --trace off

  imagem:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          tags: ghcr.io/${{ github.repository }}-backup:latest
      - name: Atualiza o serviço no Swarm (webhook do Portainer)
        if: env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
