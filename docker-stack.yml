# Docker Swarm + Traefik (rede externa "traefik_public" já existente na VPS).
# Deploy: docker stack deploy -c docker-stack.yml pdv   (ou pelo Portainer)
version: "3.8"

services:
  app:
    image: ghcr.io/arlison-pktech-ai/dm-store:latest
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    networks: [traefik_public]
    deploy:
      replicas: 1
      update_config: { order: start-first, failure_action: rollback }
      restart_policy: { condition: any }
      labels:
        - traefik.enable=true
        - traefik.http.routers.pdv.rule=Host(`${PDV_DOMINIO}`)
        - traefik.http.routers.pdv.entrypoints=websecure
        - traefik.http.routers.pdv.tls.certresolver=letsencrypt
        - traefik.http.services.pdv.loadbalancer.server.port=80

  # RNF-02: pg_dump diário às 2h (Manaus), fora da VPS e do Supabase.
  backup:
    image: ghcr.io/arlison-pktech-ai/dm-store-backup:latest
    environment:
      TZ: America/Manaus
      DATABASE_URL: ${BACKUP_DATABASE_URL}      # string de conexão direta do Supabase (role postgres)
      RCLONE_DESTINO: ${BACKUP_RCLONE_DESTINO}  # ex.: b2:pdv-backups ou gdrive:pdv-backups
      ALERTA_URL: ${BACKUP_ALERTA_URL}          # webhook (n8n/WhatsApp/e-mail) chamado se falhar
    secrets:
      - source: rclone_conf
        target: /config/rclone/rclone.conf
    deploy:
      replicas: 1
      restart_policy: { condition: any }

secrets:
  rclone_conf:
    external: true

networks:
  traefik_public:
    external: true
